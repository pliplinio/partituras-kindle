[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "partituras-kindle"
dynamic = ["version"]
description = "Organizador de Partituras para Kindle (versão Claude)"
requires-python = ">=3.13"
dependencies = [
    "pymupdf==2.1",
    "pillow==12.3.0",
    "playwright==1.63.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "ruff==0.16.9",
]

[project.scripts]
partituras = "partituras.cli:main"

[tool.setuptools.dynamic]
version = { attr = "partituras.version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Modelos de HTML que precisam reproduzir byte a byte os arquivos existentes.
"src/partituras/html/render.py" = ["E501"]
