<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fanfateste v1</title>
<style>
@page { size: 880px 650px; margin: 0; }
html, body { margin:0; padding:0; background:#fff; }
body { font-family: Arial, sans-serif; }
.slide { width:880px; height:650px; box-sizing:border-box; overflow:hidden; break-after:page; page-break-after:always; }
.slide:last-child { break-after:auto; page-break-after:auto; }
.setlist-native, .index-native { padding:40px 48px; }
h1 { margin:0 0 22px; font-size:34px; }
.setlist-list { margin:0; padding-left:34px; font-size:25px; line-height:1.55; }
.setlist-list a, .setlist-list span { color:#111; text-decoration:none; }
.index-table { width:100%; border-collapse:collapse; table-layout:fixed; font-size:24px; }
.index-table td { padding:9px 14px 9px 0; vertical-align:top; }
.index-table a { color:#111; text-decoration:none; }
</style>
</head>
<body>
<main>
<section class="slide setlist-native" id="setlist" data-role="setlist"><h1>Set list</h1><ol class="setlist-list"><li data-setlist-pos="1"><span class="setlist-missing" data-setlist-pos="1" title="Jonia">Jonia</span></li></ol></section>
<section class="slide index-native" id="index" data-role="index"><h1>Índice</h1><table aria-label="Índice alfabético de músicas" class="index-table"><tbody></tbody></table></section>
</main>
</body>
</html>
